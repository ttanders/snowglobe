# Publishes the Snowglobe web viewer (docs/) to GitHub Pages whenever main changes.
# The Google Maps web key isn't in the repo: it's the GOOGLE_MAPS_WEB_KEY repository secret,
# swapped into docs/config.js here, only in the copy that gets published.
#
# One-time setup (repo admin): Settings → Pages → Source: "GitHub Actions", and
# Settings → Secrets and variables → Actions → New repository secret: GOOGLE_MAPS_WEB_KEY.

name: Publish web viewer

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the Google Maps web key
        env:
          GOOGLE_MAPS_WEB_KEY: ${{ secrets.GOOGLE_MAPS_WEB_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_WEB_KEY" ]; then
            echo "::error::Add the GOOGLE_MAPS_WEB_KEY repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          sed -i "s|PASTE_YOUR_WEB_KEY_HERE|${GOOGLE_MAPS_WEB_KEY}|" docs/config.js
          if grep -q "PASTE_YOUR_WEB_KEY_HERE" docs/config.js; then
            echo "::error::Couldn't find the key placeholder in docs/config.js."
            exit 1
          fi

      - name: Stamp this release on script and style links
        # Pages lets browsers keep files for 10 minutes; a new ?v= per release makes them fetch
        # matching files instead of mixing a new page with old scripts.
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" docs/*.html docs/*.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
