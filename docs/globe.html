<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Snowglobe</title>
    <meta name="description" content="A real place, under glass. Made with Snowglobe.">
    <!-- Send the full page address to Google with tile requests. Browsers otherwise send only
         "https://ttanders.github.io/", which doesn't match the web key's /snowglobe/* restriction. -->
    <meta name="referrer" content="no-referrer-when-downgrade">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="style.css?v=__BUILD__">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "3d-tiles-renderer": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.4/build/index.js",
            "3d-tiles-renderer/plugins": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.4/build/index.plugins.js"
        }
    }
    </script>
</head>
<body>
    <canvas id="snow" aria-hidden="true"></canvas>
    <div class="globe-page">
        <header>
            <h1 id="title">Snowglobe</h1>
            <p class="subtitle" id="subtitle" hidden></p>
        </header>

        <div class="stage">
            <canvas id="globe" aria-label="3D snowglobe. Drag to spin, pinch or scroll to zoom, tap the glass to make it snow."></canvas>
            <div class="status glass-pill loading" id="status" role="status" aria-live="polite">
                <div class="status-row">
                    <span class="spinner" aria-hidden="true"></span>
                    <span id="status-text">Opening your snowglobe…</span>
                </div>
                <div class="progress" id="status-progress" hidden><div class="progress-fill" id="status-fill"></div></div>
            </div>
        </div>

        <div class="actions">
            <button id="shake" class="glass-pill shake-button" type="button" aria-describedby="hint">❄︎ Shake</button>
        </div>
        <div class="hint glass-pill" id="hint">Drag to spin · Tap the glass or shake your phone to make it snow</div>

        <div class="credits" id="credits" hidden></div>

        <footer>Made with Snowglobe · <a href="./">What's this?</a></footer>
    </div>

    <script src="snow.js?v=__BUILD__"></script>
    <script src="config.js?v=__BUILD__"></script>
    <script type="module" src="globe.js?v=__BUILD__"></script>
</body>
</html>
